
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AC Services</title>

    <!--
        ============================================================
        LCP / HERO IMAGE PRELOAD
        ============================================================

        Only preload this image if it is actually the LCP image.

        AVIF is preferred because it is usually smaller than WebP/PNG.
        The browser uses imagesrcset + imagesizes to select the
        appropriate image instead of blindly downloading the 800px file.
    -->
    <link rel="preload" as="image" type="image/avif" href="assets/images/services/ac-service-400.avif" imagesrcset="
            assets/images/services/ac-service-100.avif 100w,
            assets/images/services/ac-service-200.avif 200w,
            assets/images/services/ac-service-400.avif 400w,
            assets/images/services/ac-service-800.avif 800w
        " imagesizes="
            (min-width: 1024px) 210px,
            (min-width: 480px) 38vw,
            (min-width: 282px) 33vw,
            100vw
        " fetchpriority="high">

    <style>
        /* ============================================================
           IMAGE CONTAINER
           ============================================================ */

        .service-picture {
            display: block;
            position: relative;

            width: 100%;
            aspect-ratio: 4 / 3;

            overflow: hidden;
            border-radius: 8px;

            background-color: #f3f4f6;
        }


        /* ============================================================
           IMAGES
           ============================================================ */

        .service-img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* ============================================================
           OPTIONAL FADE-IN FOR NON-CRITICAL IMAGES
           ============================================================ */

        /*
            We intentionally DO NOT hide the hero image.

            If you want the fade-in effect for below-the-fold images,
            add the "fade-in" class to those images.
        */

        .service-img.fade-in {
            opacity: 0;
            transition: opacity 300ms ease-in;
        }

        .service-img.fade-in.is-loaded {
            opacity: 1;
        }


        /* ============================================================
           BELOW-THE-FOLD OPTIMIZATION
           ============================================================ */

        .service-card {
            content-visibility: auto;

            /*
                Gives the browser an estimated size for off-screen
                content before it is rendered.
            */
            contain-intrinsic-size: 0 300px;
        }
    </style>
</head>


<body>

    <!-- ============================================================
         HERO
         ============================================================ -->

    <section class="hero">

        <h1>AC Repair &amp; Service</h1>

        <!--
            ABOVE-THE-FOLD / LCP IMAGE

            Important:
            - No loading="lazy"
            - fetchpriority="high"
            - decoding="async"
            - Explicit width/height
            - AVIF first
            - WebP second
            - PNG fallback
        -->

        <picture class="service-picture">

            <!-- AVIF: preferred format -->
            <source type="image/avif" srcset="
                    assets/images/services/ac-service-100.avif 100w,
                    assets/images/services/ac-service-200.avif 200w,
                    assets/images/services/ac-service-400.avif 400w,
                    assets/images/services/ac-service-800.avif 800w
                " sizes="
                    (min-width: 1024px) 210px,
                    (min-width: 480px) 38vw,
                    (min-width: 282px) 33vw,
                    100vw
                ">

            <!-- WebP: fallback for browsers without AVIF -->
            <source type="image/webp" srcset="
                    assets/images/services/ac-service-100.webp 100w,
                    assets/images/services/ac-service-200.webp 200w,
                    assets/images/services/ac-service-400.webp 400w,
                    assets/images/services/ac-service-800.webp 800w
                " sizes="
                    (min-width: 1024px) 210px,
                    (min-width: 480px) 38vw,
                    (min-width: 282px) 33vw,
                    100vw
                ">

            <!-- PNG fallback -->
            <img src="assets/images/services/ac-service-400.png" srcset="
                    assets/images/services/ac-service-100.png 100w,
                    assets/images/services/ac-service-200.png 200w,
                    assets/images/services/ac-service-400.png 400w,
                    assets/images/services/ac-service-800.png 800w
                " sizes="
                    (min-width: 1024px) 210px,
                    (min-width: 480px) 38vw,
                    (min-width: 282px) 33vw,
                    100vw
                " width="400" height="300" alt="Technician servicing a split AC unit" loading="eager"
                fetchpriority="high" decoding="async" class="service-img">

        </picture>

    </section>


    <!-- ============================================================
         SERVICES
         ============================================================ -->

    <section class="services">

                            assets/images/services/ac-service-200.png 200w,
                            assets/images/services/ac-service-400.png 400w,
                            assets/images/services/ac-service-800.png 800w
                        " sizes="
                            (min-width: 1024px) 210px,
                            (min-width: 480px) 38vw,
                            (min-width: 282px) 33vw,
                            100vw
                        " width="400" height="300" alt="AC repair service" loading="lazy" decoding="async"
                        class="service-img fade-in">

                </picture>

                <h3>AC Repair</h3>

            </article>

    </section>


    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->

    <script>
        /*
         * Fade-in is used ONLY for images that have the "fade-in"
         * class.
         *
         * The hero image does not have this class because it is
         * potentially the LCP image and should be painted immediately.
         */

        document.querySelectorAll('.service-img.fade-in').forEach((img) => {

            if (img.complete && img.naturalWidth > 0) {
                img.classList.add('is-loaded');
                return;
            }

            img.addEventListener('load', () => {
                img.classList.add('is-loaded');
            }, {
                once: true
            });

        });


        /*
         * Development-time image error logging.
         *
         * This does not affect image loading performance significantly
         * and helps detect broken image paths.
         */

        document.querySelectorAll('img').forEach((img) => {

            img.addEventListener('error', () => {

                console.warn(
                    '❌ Image failed to load:',
                    img.currentSrc || img.src
                );

            });

        });
    </script>

</body>
